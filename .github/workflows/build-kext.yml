name: build

# Single workflow. Builds the kext (and, on a tag, the full Metal stack) for the
# Intel Core i3-1220P on macOS Tahoe 26.7.1 (25G241). One run per trigger — no separate
# release runtime.
#
# Runner: macos-26-intel (Tahoe x86_64). MUST be Tahoe: macos/build-shader-compiler.sh reads
# /System/Library/PrivateFrameworks/GPUCompiler.framework/Versions/32023/Libraries/libLLVM.dylib,
# which only exists on Tahoe (Sequoia ships 3902). The kext + libxedrv are x86_64, so a native
# x86 runner also avoids cross-compiling.
#
# On a tag v*: builds NootedGreen.kext + the macos/ Metal/shader stack and publishes a release with
#   two assets — the bare kext, and a zip that installs full Metal WITHOUT Xcode (prebuilt kext +
#   Apple's 16.0.32 TGL bundles + copy-only installer).
# On push/workflow_dispatch: publishes the build as a prerelease.
# On pull_request: builds and verifies only (no publish).
#
# The sgiammori/NootedGreen commit is parsed from install.sh (NG_COMMIT) so the hash has one source.

on:
  push:
    branches: [main, port-i3-1220p]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Apple's 16.0.32 TGL bundles (sgiammori/NootedGreen)
        run: |
          NG=build/deps/NootedGreen
          NG_COMMIT=$(grep -m1 'NG_COMMIT=' install.sh | cut -d= -f2)
          mkdir -p "$(dirname "$NG")"
          git clone -q https://github.com/sgiammori/NootedGreen.git "$NG"
          git -C "$NG" checkout -q "$NG_COMMIT"
          test -d "$NG/sle_Internal/sle/AppleIntelTGLGraphicsMTLDriver.bundle" || { echo "sle_Internal/sle missing in NootedGreen"; exit 1; }
          test -d "$NG/sle_Internal/le/AppleIntelTGLGraphics.kext"            || { echo "sle_Internal/le missing in NootedGreen"; exit 1; }
          echo "SLE=$NG/sle_Internal/sle" >> "$GITHUB_ENV"
          echo "LE=$NG/sle_Internal/le"  >> "$GITHUB_ENV"
          echo "NootedGreen @ $NG_COMMIT"

      - name: Build NootedGreen.kext
        run: zsh build-nootedgreen.sh

      - name: Build the user-space Metal + shader stack
        run: zsh macos/build-all.sh "$SLE"

      - name: Verify
        run: |
          echo '== kext arch'
          file build/NootedGreen.kext/Contents/MacOS/NootedGreen
          echo '== signature'
          codesign -dv build/NootedGreen.kext 2>&1 || true
          echo '== OSBundleLibraries'
          /usr/libexec/PlistBuddy -c 'Print :OSBundleLibraries' build/NootedGreen.kext/Contents/Info.plist
          echo '== macos/out'
          ls -la macos/out
          echo '== xe.bundle/Contents/MacOS'
          ls -la macos/out/xe.bundle/Contents/MacOS
          test -d macos/out/AppleIntelTGLGraphicsMTLDriver.bundle || { echo "patched MTL bundle missing"; exit 1; }
          test -e macos/out/xe.bundle/Contents/MacOS/libMTLIGCCompilerPlugin.dylib || { echo "xe.bundle adapter missing"; exit 1; }

      - name: Assemble the no-build install package
        run: |
          PKG=pkg/IrisXe-i3-1220P
          mkdir -p "$PKG"
          ditto build/NootedGreen.kext "$PKG/NootedGreen.kext"
          ditto "$SLE" "$PKG/sle"
          ditto "$LE"  "$PKG/le"
          ditto macos/out "$PKG/out"
          cp macos/install-release.sh "$PKG/install.command"
          chmod +x "$PKG/install.command"
          cp macos/RELEASE-README.txt "$PKG/README.txt"
          (cd pkg && zip -qrX IrisXe-i3-1220P-tahoe.zip IrisXe-i3-1220P)

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="$GITHUB_REF_NAME"
            gh release create "$TAG" \
              --title "$TITLE" \
              --generate-notes \
              build/NootedGreen.kext \
              pkg/IrisXe-i3-1220P-tahoe.zip
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            TITLE="Build ${GITHUB_RUN_NUMBER}"
            NOTES="Automated build from ${GITHUB_SHA}."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              build/NootedGreen.kext \
              pkg/IrisXe-i3-1220P-tahoe.zip
          fi